# This file has SIX problems. Some stop the parser (syntax errors).
# Others parse fine but give you the wrong data, which is worse.
# Run YamlCheck after every fix: it stops at the first syntax error it finds.
#
# Target: the JSON printed by YamlCheck should match expected.json in this folder.

openapi: 3.1.0
info:
  title: Library API: internal
  version: 1.10
  description: Look up books
servers:
  - url: http://localhost:5000
paths:
  /books:
    get:
      operationId: listBooks
      deprecated: no
      tags: [Books]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: #/components/schemas/Book
components:
  schemas:
    Book:
      type: object
      required:
      - id
      - title
      properties:
        id:    {type: integer}
        title: {type: string}
	isbn:  {type: string, example: 0123456789}
